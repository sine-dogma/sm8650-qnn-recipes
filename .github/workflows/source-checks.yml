name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/test.txt
      - name: Install source test dependencies
        run: python -m pip install -e . -r requirements/test.txt
      - name: Check Python syntax
        run: python -m compileall -q src scripts tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit publishable source
        run: python scripts/audit-source.py
      - name: Check CLI without SDK credentials
        run: sm8650-qnn list
